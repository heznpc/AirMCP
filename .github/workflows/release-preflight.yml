name: Release Preflight

on:
  workflow_dispatch:

concurrency:
  group: release-preflight
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: npm ci

      - name: Build dry release artifacts
        run: npm run release:preflight -- --app

      - name: Upload dry release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airmcp-release-preflight
          path: build/release-preflight/*
          if-no-files-found: error
