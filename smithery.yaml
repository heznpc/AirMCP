name: airmcp
description: Maintenance ended. v2.16.6 is the final release of this MCP runtime connecting AI clients to Apple apps on macOS. Source and history are preserved for forks.
homepage: https://github.com/heznpc/AirMCP
icon: https://raw.githubusercontent.com/heznpc/AirMCP/main/icons/airmcp-icon-256.png
license: MIT
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      includeShared:
        type: boolean
        default: false
        description: Include shared notes/folders in results
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'airmcp'],
      env: config.includeShared ? { AIRMCP_INCLUDE_SHARED: 'true' } : {}
    })
