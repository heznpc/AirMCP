name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_auth_mode:
        description: 'npm auth mode. Use trusted publishing by default; token mode is only for fallback.'
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - token
      release_sha:
        description: >-
          Resume an interrupted publish of an already-released commit. Must be an
          ancestor of main; if the version tag exists it must point at this commit.
          Leave empty to publish the dispatched main HEAD (the normal path).
        required: false
        default: ''
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: macos-latest
    environment: npm
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # release_sha exists for one situation: a release commit published the root
      # package and then a later step failed, and by the time the fallback rerun
      # is dispatched main has already advanced — so github.sha no longer matches
      # the registry gitHead and the identity check can never pass. The resume
      # path keeps both supply-chain invariants: the dispatch still comes from
      # refs/heads/main, and the resumed commit must be an ancestor of that main.
      - name: Verify release source
        env:
          RELEASE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is allowed only from refs/heads/main, got $RELEASE_REF"
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out commit $CHECKED_OUT_SHA does not match release commit $RELEASE_SHA"
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$WORKFLOW_SHA" ]; then
            if ! git merge-base --is-ancestor "$RELEASE_SHA" "$WORKFLOW_SHA"; then
              echo "::error::release_sha $RELEASE_SHA is not an ancestor of the dispatched main commit $WORKFLOW_SHA"
              exit 1
            fi
            echo "::notice::Resuming interrupted publish of $RELEASE_SHA (main is at $WORKFLOW_SHA)."
          fi

      # This must be inline: an older release_sha may not contain any of the
      # new release helpers. Reject that checkout before package publication,
      # rather than discovering the missing protocol after npm is immutable.
      - name: Verify release resume protocol
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          try {
            const workflow = readFileSync('.github/workflows/release-app.yml', 'utf8');
            // Version 1 correlates the dispatch input with this exact run title.
            // Assemble expression delimiters so Actions does not evaluate them.
            const expression = (value) => '$' + '{{ ' + value + ' }}';
            const runName = 'run-name: Signed app ' + expression('inputs.tag')
              + ' (' + expression('inputs.release_request_id || github.run_id') + ')';
            if (!workflow.split('\n').some((line) => line.trim() === runName)
                || !/^ {6}release_request_id:\s*$/m.test(workflow)) {
              throw new Error('Unsupported signed app workflow protocol');
            }
            // Import also verifies that the checked-out helper's dependencies
            // exist. No GitHub request is made when this module is imported.
            const dispatcher = await import(pathToFileURL(resolve('scripts/dispatch-signed-app-release.mjs')));
            if (typeof dispatcher.dispatchSignedAppRelease !== 'function') {
              throw new Error('Missing signed app dispatcher');
            }
          } catch {
            console.log(`::error::release_sha ${process.env.RELEASE_SHA} does not support the signed app release resume protocol. Publish a new version from current main; this checkout cannot be resumed safely.`);
            process.exitCode = 1;
          }
          NODE

      - name: Extract package info
        id: pkg
        run: |
          NAME=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION"

      - name: Version guard
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/v${{ steps.pkg.outputs.version }}"; then
            TAG_SHA="$(git rev-parse "refs/tags/v${{ steps.pkg.outputs.version }}^{commit}")"
            if [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag v${{ steps.pkg.outputs.version }} already exists at $TAG_SHA, not at the release commit. Bump the version first."
              exit 1
            fi
            echo "::notice::Tag v${{ steps.pkg.outputs.version }} already points at this commit — resuming an interrupted publish."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # npm trusted publishing (OIDC → registry token exchange) requires
      # npm >= 11.5.1; the npm bundled with Node 22 is 10.x, which signs
      # provenance but sends the registry PUT unauthenticated (surfaces as
      # E404 on an OIDC-only package).
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12
          npm --version

      - name: Select npm auth mode
        id: npm-auth
        env:
          NPM_AUTH_MODE: ${{ inputs.npm_auth_mode || 'trusted-publishing' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$NPM_AUTH_MODE" in
            trusted-publishing)
              echo "mode=trusted-publishing" >> "$GITHUB_OUTPUT"
              echo "::notice::Using npm trusted publishing. NPM_TOKEN is ignored even if the secret is set."
              ;;
            token)
              if [ -z "${NPM_TOKEN:-}" ]; then
                echo "::error::npm_auth_mode=token requires the NPM_TOKEN secret."
                exit 1
              fi
              echo "mode=token" >> "$GITHUB_OUTPUT"
              echo "::notice::Using NPM_TOKEN fallback for npm publish."
              ;;
            *)
              echo "::error::Unsupported npm_auth_mode: $NPM_AUTH_MODE"
              exit 1
              ;;
          esac

      - name: npm auth preflight
        if: steps.npm-auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Install dependencies
        run: npm ci

      # Keep governed app acceptance in this lane so a broken app cannot be
      # published around by an otherwise healthy npm/.mcpb build.
      - name: Release preflight (governed app gate)
        run: npm run release:preflight -- --app

      # npm versions are immutable. Refuse to create even the first registry
      # artifact unless the downstream signed lane is protected by review,
      # no-admin-bypass, and a matching tag-only deployment policy. Query this
      # immediately before registry inspection/publish so a protection change
      # during the longer governed preflight also fails closed.
      - name: Verify signed release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.pkg.outputs.version }}
        run: node scripts/verify-release-environment.mjs --repo="${{ github.repository }}" --tag="$RELEASE_TAG"

      - name: Require signed app distribution
        env:
          SIGNED_APP_RELEASE: ${{ vars.SIGNED_APP_RELEASE }}
        run: |
          if [ "$SIGNED_APP_RELEASE" != "true" ]; then
            echo "::error::SIGNED_APP_RELEASE must be true; a desktop release requires its signed app ZIP."
            exit 1
          fi

      # An interrupted earlier attempt may already have published part of this
      # immutable version. Resume only when the registry tarball SRI and
      # npm gitHead prove it is byte-for-byte the artifact from github.sha.
      - name: Inspect root registry identity
        id: root-identity
        env:
          AIRMCP_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/verify-publish-identity.mjs --allow-missing

      - name: Publish root with provenance
        if: steps.npm-auth.outputs.mode == 'trusted-publishing' && steps.root-identity.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Publish root with provenance (token fallback)
        if: steps.npm-auth.outputs.mode == 'token' && steps.root-identity.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Verify root registry identity
        env:
          AIRMCP_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/verify-publish-identity.mjs --retry-seconds=600

      - name: Publish add-ons with provenance
        if: steps.npm-auth.outputs.mode == 'trusted-publishing'
        env:
          AIRMCP_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          npm run addons:publish -- --publish --all --no-build --skip-verify

      - name: Publish add-ons with provenance (token fallback)
        if: steps.npm-auth.outputs.mode == 'token'
        env:
          AIRMCP_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run addons:publish -- --publish --all --no-build --skip-verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.5.0
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ inputs.release_sha || github.sha }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: build/release-preflight/airmcp-${{ steps.pkg.outputs.version }}.mcpb
          fail_on_unmatched_files: true

      # Events created with GITHUB_TOKEN do not recursively trigger tag-push
      # workflows. Dispatch the signed lane explicitly and let that workflow
      # re-check the immutable tag, package, bundle, and signing environment.
      #
      # Wait for this exact dispatch, including its protected-environment review.
      # A successful npm upload is not a successful desktop release. The observer
      # propagates signing failures and requires both assets before returning.
      - name: Dispatch and await signed app release
        timeout-minutes: 125
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.pkg.outputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/dispatch-signed-app-release.mjs

      - name: Verify public release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:verify -- --expected-sha=${{ inputs.release_sha || github.sha }}
